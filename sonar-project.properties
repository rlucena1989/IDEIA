# SonarQube Configuration for IDEIA

sonar.projectKey=ideia
sonar.projectName=IDEIA
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=packages
sonar.sourceEncoding=UTF-8
sonar.language=ts

# Exclusions
sonar.exclusions=**/*.test.ts,**/*.spec.ts,**/node_modules/**,**/dist/**,**/lib/**,**/*.d.ts
sonar.test.exclusions=**/*.test.ts,**/*.spec.ts
sonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/node_modules/**

# TypeScript
sonar.tsconfig=tsconfig.json
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Test coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/test-report.xml
sonar.coverage.jacoco.xmlReportPaths=coverage/jacoco.xml

# Code quality thresholds
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Technical debt
sonar.technicalDebt.rating=0.2
sonar.sqale.rating=0.2

# Duplications
sonar.cpd.ts.minimumTokens=50
sonar.cpd.ts.minimumLines=10

# Size metrics
sonar.size.metric=ncloc

# Issues
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S4328
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.test.ts
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S1135
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.test.ts

# Security
sonar.security.hotspot.enabled=true
