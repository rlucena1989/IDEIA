name: node-api
version: 1.0.0
description: Node.js REST API with Express/Fastify, Clean Architecture, Zod validation, JWT auth, PostgreSQL/DuckDB
author: IDEIA Team
tags:
  - api
  - rest
  - express
  - fastify
  - typescript
  - postgresql
  - clean-architecture
  - jwt
  - docker

variables:
  - name: projectName
    type: string
    description: Name of the project
    prompt: Project name
    required: true
    validate: "^[a-z0-9-]+$"

  - name: description
    type: string
    description: Description of the project
    prompt: Project description
    default: "REST API generated by IDEIA Blueprint"

  - name: framework
    type: select
    description: API framework
    prompt: Select framework
    default: express
    options:
      - express
      - fastify

  - name: database
    type: select
    description: Database
    prompt: Select database
    default: postgresql
    options:
      - postgresql
      - duckdb
      - sqlite

  - name: auth
    type: multi-select
    description: Authentication strategy
    prompt: Authentication strategies
    default:
      - jwt
    options:
      - jwt
      - oauth

  - name: orm
    type: select
    description: ORM / Query builder
    prompt: Select ORM
    default: drizzle
    options:
      - drizzle
      - prisma
      - kysely

  - name: includeSwagger
    type: boolean
    description: Include Swagger/OpenAPI documentation
    prompt: Include Swagger/OpenAPI?
    default: true

  - name: includeDocker
    type: boolean
    description: Include Docker setup
    prompt: Include Docker?
    default: true

  - name: includeTests
    type: boolean
    description: Include test setup
    prompt: Include tests?
    default: true

structure:
  src/:
    main.ts:
      template: |
        import { createServer } from './server';
        import { config } from './config';

        const app = createServer();

        app.listen(config.port, () => {
          console.log(`Server running on port ${config.port}`);
        });
    server.ts:
      template: |
        import express from 'express';
        import cors from 'cors';
        import helmet from 'helmet';
        import { config } from './config';
        import { errorHandler } from './common/middleware/error-handler';
        import { registerRoutes } from './routes';

        export function createServer() {
          const app = express();

          app.use(helmet());
          app.use(cors());
          app.use(express.json());

          registerRoutes(app);

          app.use(errorHandler);

          return app;
        }
    config/:
      index.ts:
        template: |
          export const config = {
            port: parseInt(process.env.PORT || '3000', 10),
            host: process.env.HOST || '0.0.0.0',
            nodeEnv: process.env.NODE_ENV || 'development',
            jwtSecret: process.env.JWT_SECRET || 'change-me',
            jwtExpiresIn: process.env.JWT_EXPIRES_IN || '7d',
            database: {
              url: process.env.DATABASE_URL || 'postgresql://localhost:5432/<%= projectName %>',
            },
          };
      database.ts:
        template: |
          import { drizzle } from 'drizzle-orm/node-postgres';
          import { Pool } from 'pg';
          import { config } from './index';

          const pool = new Pool({ connectionString: config.database.url });
          export const db = drizzle(pool);
        condition: "database === 'postgresql' && orm === 'drizzle'"
      auth.ts:
        template: |
          import { config } from './index';

          export const authConfig = {
            jwtSecret: config.jwtSecret,
            jwtExpiresIn: config.jwtExpiresIn,
          };
        condition: "auth.includes('jwt')"
    modules/:
      health/:
        health.controller.ts:
          template: |
            import { Router } from 'express';
            import { db } from '../../config/database';

            const router = Router();

            router.get('/health', async (req, res) => {
              const dbStatus = await db.execute('SELECT 1')
                .then(() => 'healthy')
                .catch(() => 'unhealthy');

              res.json({
                status: 'healthy',
                timestamp: new Date().toISOString(),
                database: dbStatus,
              });
            });

            export { router as healthRouter };
        health.test.ts:
          template: ''
          condition: "includeTests"
      users/:
        users.controller.ts:
          template: |
            import { Router } from 'express';
            import { UserService } from './users.service';
            import { CreateUserDto, UpdateUserDto } from './contract/users.dto';
            import { authenticate } from '../../common/middleware/auth';

            const router = Router();
            const userService = new UserService();

            router.get('/', authenticate, async (req, res, next) => {
              try {
                const users = await userService.findAll();
                res.json(users);
              } catch (err) { next(err); }
            });

            router.get('/:id', authenticate, async (req, res, next) => {
              try {
                const user = await userService.findById(req.params.id);
                if (!user) return res.status(404).json({ message: 'User not found' });
                res.json(user);
              } catch (err) { next(err); }
            });

            router.post('/', async (req, res, next) => {
              try {
                const dto = CreateUserDto.parse(req.body);
                const user = await userService.create(dto);
                res.status(201).json(user);
              } catch (err) { next(err); }
            });

            router.put('/:id', authenticate, async (req, res, next) => {
              try {
                const dto = UpdateUserDto.parse(req.body);
                const user = await userService.update(req.params.id, dto);
                res.json(user);
              } catch (err) { next(err); }
            });

            router.delete('/:id', authenticate, async (req, res, next) => {
              try {
                await userService.delete(req.params.id);
                res.status(204).send();
              } catch (err) { next(err); }
            });

            export { router as usersRouter };
        users.service.ts:
          template: |
            import { db } from '../../config/database';
            import { users } from './contract/users.schema';
            import { eq } from 'drizzle-orm';
            import type { CreateUserDto, UpdateUserDto } from './contract/users.dto';

            export class UserService {
              async findAll() {
                return db.select().from(users);
              }

              async findById(id: string) {
                const result = await db.select().from(users).where(eq(users.id, id)).limit(1);
                return result[0] || null;
              }

              async create(dto: CreateUserDto) {
                const result = await db.insert(users).values(dto).returning();
                return result[0];
              }

              async update(id: string, dto: UpdateUserDto) {
                const result = await db.update(users).set(dto).where(eq(users.id, id)).returning();
                return result[0];
              }

              async delete(id: string) {
                await db.delete(users).where(eq(users.id, id));
              }
            }
        contract/:
          users.dto.ts:
            template: |
              import { z } from 'zod';

              export const CreateUserDto = z.object({
                name: z.string().min(1).max(255),
                email: z.string().email(),
                password: z.string().min(8).max(128),
                role: z.enum(['admin', 'user', 'viewer']).default('user'),
              });

              export const UpdateUserDto = z.object({
                name: z.string().min(1).max(255).optional(),
                email: z.string().email().optional(),
                role: z.enum(['admin', 'user', 'viewer']).optional(),
              });

              export const UserResponseDto = z.object({
                id: z.string().uuid(),
                name: z.string(),
                email: z.string().email(),
                role: z.enum(['admin', 'user', 'viewer']),
                createdAt: z.string().datetime(),
                updatedAt: z.string().datetime(),
              });

              export type CreateUserDto = z.infer<typeof CreateUserDto>;
              export type UpdateUserDto = z.infer<typeof UpdateUserDto>;
              export type UserResponseDto = z.infer<typeof UserResponseDto>;
          users.schema.ts:
            template: |
              import { pgTable, uuid, varchar, timestamp } from 'drizzle-orm/pg-core';

              export const users = pgTable('users', {
                id: uuid('id').defaultRandom().primaryKey(),
                name: varchar('name', { length: 255 }).notNull(),
                email: varchar('email', { length: 255 }).notNull().unique(),
                password: varchar('password', { length: 255 }).notNull(),
                role: varchar('role', { length: 50 }).notNull().default('user'),
                createdAt: timestamp('created_at').defaultNow().notNull(),
                updatedAt: timestamp('updated_at').defaultNow().notNull(),
              });
            condition: "orm === 'drizzle'"
    common/:
      middleware/:
        error-handler.ts:
          template: |
            import type { Request, Response, NextFunction } from 'express';
            import { ZodError } from 'zod';

            export function errorHandler(err: Error, req: Request, res: Response, next: NextFunction) {
              if (err instanceof ZodError) {
                res.status(400).json({
                  message: 'Validation error',
                  errors: err.errors,
                });
                return;
              }

              console.error('Unhandled error:', err);
              res.status(500).json({ message: 'Internal server error' });
            }
        auth.ts:
          template: |
            import type { Request, Response, NextFunction } from 'express';
            import jwt from 'jsonwebtoken';
            import { config } from '../../config';

            export function authenticate(req: Request, res: Response, next: NextFunction) {
              const token = req.headers.authorization?.replace('Bearer ', '');
              if (!token) {
                res.status(401).json({ message: 'Authentication required' });
                return;
              }
              try {
                const decoded = jwt.verify(token, config.jwtSecret);
                (req as any).user = decoded;
                next();
              } catch {
                res.status(401).json({ message: 'Invalid token' });
              }
            }
          condition: "auth.includes('jwt')"
    routes.ts:
      template: |
        import type { Express } from 'express';
        import { healthRouter } from './modules/health/health.controller';
        import { usersRouter } from './modules/users/users.controller';

        export function registerRoutes(app: Express) {
          app.use(healthRouter);
          app.use('/api/users', usersRouter);
        }
  test/:
    setup.ts:
      template: ''
      condition: "includeTests"
    health.test.ts:
      template: ''
      condition: "includeTests"

dependencies:
  dependencies:
    express: ^4.18.0
    cors: ^2.8.5
    helmet: ^7.1.0
    zod: ^3.23.0
    jsonwebtoken: ^9.0.0
    drizzle-orm: ^0.30.0
    postgres: ^3.4.0
    reflect-metadata: ^0.1.14
  devDependencies:
    typescript: ^5.4.0
    '@types/node': ^20.11.0
    '@types/express': ^4.17.21
    '@types/cors': ^2.8.17
    '@types/jsonwebtoken': ^9.0.5
    tsx: ^4.7.0
    jest: ^29.7.0
    ts-jest: ^29.1.0
    '@types/jest': ^29.5.0
    eslint: ^8.56.0
    '@typescript-eslint/parser': ^7.0.0
    '@typescript-eslint/eslint-plugin': ^7.0.0
    prettier: ^3.2.0
    eslint-config-prettier: ^9.1.0
    eslint-plugin-prettier: ^5.1.0

configs:
  tsconfig:
    compilerOptions:
      target: ES2022
      module: commonjs
      outDir: ./dist
      rootDir: ./src
      strict: true
      esModuleInterop: true
      resolveJsonModule: true
      declaration: true
      sourceMap: true
      paths:
        "@/*": ["./src/*"]
      baseUrl: ./
    include:
      - src/**/*

  eslint:
    parser: '@typescript-eslint/parser'
    plugins:
      - '@typescript-eslint'
    extends:
      - eslint:recommended
      - plugin:@typescript-eslint/recommended
      - plugin:prettier/recommended
    rules:
      '@typescript-eslint/no-explicit-any': error
      '@typescript-eslint/no-unused-vars':
        - error
        - argsIgnorePattern: ^_
      no-console: warn
    ignorePatterns:
      - dist
      - node_modules

  prettier:
    semi: true
    singleQuote: true
    tabWidth: 2
    trailingComma: all
    printWidth: 100

  jest:
    preset: ts-jest
    testEnvironment: node
    roots:
      - <rootDir>/src
    testMatch:
      - '**/*.test.ts'
      - '**/*.spec.ts'
    moduleNameMapper:
      '^@/(.*)$': <rootDir>/src/$1

  dockerCompose:
    services:
      app:
        build: .
        ports:
          - 3000:3000
        environment:
          NODE_ENV: development
        depends_on:
          - postgres
      postgres:
        image: postgres:16-alpine
        environment:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        volumes:
          - pgdata:/var/lib/postgresql/data
    volumes:
      pgdata:

  dockerfile: {}
  envExample: {}
  gitignore: {}
  editorconfig: {}

contracts:
  schemaFormat: zod
  generateTests: true
  generateOpenAPI: true
  modules:
    - name: users
      version: 1.0.0
      description: User management module
      interfaces:
        - name: IUserService
          methods:
            - name: findAll
              params: []
              returns: Promise<UserResponseDto[]>
            - name: findById
              params:
                - name: id
                  type: string
              returns: Promise<UserResponseDto | null>
            - name: create
              params:
                - name: data
                  type: CreateUserDto
              returns: Promise<UserResponseDto>
            - name: update
              params:
                - name: id
                  type: string
                - name: data
                  type: UpdateUserDto
              returns: Promise<UserResponseDto>
            - name: delete
              params:
                - name: id
                  type: string
              returns: Promise<void>
        - name: IUserRepository
          methods:
            - name: save
              params:
                - name: user
                  type: CreateUserDto
              returns: Promise<UserResponseDto>
            - name: findById
              params:
                - name: id
                  type: string
              returns: Promise<UserResponseDto | null>
            - name: findAll
              params: []
              returns: Promise<UserResponseDto[]>
            - name: delete
              params:
                - name: id
                  type: string
              returns: Promise<void>
    - name: health
      version: 1.0.0
      description: Health check module
      interfaces:
        - name: IHealthService
          methods:
            - name: check
              params: []
              returns: Promise<{ status: string; timestamp: string; database: string }>

adrs:
  autoGenerate: true
  templates:
    - title: Framework Selection
    - title: Database Selection
    - title: Architecture Pattern
    - title: Authentication Strategy

postProcess:
  - command: git init
    description: Initialize git repository
  - command: npm install
    description: Install dependencies
    condition: "!skipInstall"
    timeout: 120000
  - command: npm run build
    description: Build project
    condition: "!skipBuild"
