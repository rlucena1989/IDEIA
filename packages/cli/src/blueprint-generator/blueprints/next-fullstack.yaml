name: next-fullstack
version: 1.0.0
description: Full-stack Next.js application with API routes, TypeScript, Tailwind CSS, authentication, database
author: IDEIA Team
tags:
  - fullstack
  - nextjs
  - react
  - typescript
  - tailwind
  - postgresql
  - prisma
  - authentication

variables:
  - name: projectName
    type: string
    description: Name of the project
    prompt: Project name
    required: true
    validate: "^[a-z0-9-]+$"

  - name: description
    type: string
    description: Description of the project
    prompt: Project description
    default: "Next.js fullstack application generated by IDEIA Blueprint"

  - name: database
    type: select
    description: Database
    prompt: Select database
    default: postgresql
    options:
      - postgresql
      - sqlite
      - mysql

  - name: authProvider
    type: select
    description: Authentication provider
    prompt: Select authentication provider
    default: next-auth
    options:
      - next-auth
      - clerk
      - custom

  - name: includeE2E
    type: boolean
    description: Include E2E tests with Playwright
    prompt: Include Playwright E2E tests?
    default: true

  - name: includeStorybook
    type: boolean
    description: Include Storybook
    prompt: Include Storybook?
    default: false

  - name: includeDocker
    type: boolean
    description: Include Docker setup
    prompt: Include Docker?
    default: true

  - name: packageManager
    type: select
    description: Package manager
    prompt: Select package manager
    default: pnpm
    options:
      - npm
      - pnpm
      - yarn

structure:
  src/:
    app/:
      layout.tsx:
        template: |
          import type { Metadata } from 'next';
          import { Inter } from 'next/font/google';
          import './globals.css';
          import { Providers } from '@/components/providers';

          const inter = Inter({ subsets: ['latin'] });

          export const metadata: Metadata = {
            title: '<%= projectName %>',
            description: '<%= description %>',
          };

          export default function RootLayout({ children }: { children: React.ReactNode }) {
            return (
              <html lang="en">
                <body className={inter.className}>
                  <Providers>{children}</Providers>
                </body>
              </html>
            );
          }
      page.tsx:
        template: |
          import Link from 'next/link';

          export default function Home() {
            return (
              <main className="flex min-h-screen flex-col items-center justify-center p-24">
                <h1 className="text-4xl font-bold mb-8">
                  Welcome to <%= projectName %>
                </h1>
                <p className="text-xl mb-4"><%= description %></p>
                <div className="flex gap-4">
                  <Link href="/dashboard" className="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
                    Dashboard
                  </Link>
                  <Link href="/api/health" className="px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600">
                    Health Check
                  </Link>
                </div>
              </main>
            );
          }
      globals.css:
        template: |
          @tailwind base;
          @tailwind components;
          @tailwind utilities;
      api/:
        health/:
          route.ts:
            template: |
              import { NextResponse } from 'next/server';

              export async function GET() {
                return NextResponse.json({
                  status: 'healthy',
                  timestamp: new Date().toISOString(),
                  uptime: process.uptime(),
                });
              }
        auth/:
          '[...nextauth]'/:
            route.ts:
              template: |
                import NextAuth from 'next-auth';
                import { authOptions } from '@/lib/auth';

                const handler = NextAuth(authOptions);
                export { handler as GET, handler as POST };
              condition: "authProvider === 'next-auth'"
      dashboard/:
        page.tsx:
          template: |
            import { getServerSession } from 'next-auth';
            import { redirect } from 'next/navigation';
            import { authOptions } from '@/lib/auth';

            export default async function DashboardPage() {
              const session = await getServerSession(authOptions);
              if (!session) redirect('/api/auth/signin');

              return (
                <div className="p-8">
                  <h1 className="text-2xl font-bold mb-4">Dashboard</h1>
                  <p>Welcome, {session.user?.name || session.user?.email}</p>
                </div>
              );
            }
          condition: "authProvider === 'next-auth'"
    components/:
      providers.tsx:
        template: |
          'use client';
          import { SessionProvider } from 'next-auth/react';

          export function Providers({ children }: { children: React.ReactNode }) {
            return <SessionProvider>{children}</SessionProvider>;
          }
      ui/:
        button.tsx:
          template: |
            import { ButtonHTMLAttributes, forwardRef } from 'react';

            interface ButtonProps extends ButtonHTMLAttributes<HTMLButtonElement> {
              variant?: 'primary' | 'secondary' | 'outline';
              size?: 'sm' | 'md' | 'lg';
            }

            export const Button = forwardRef<HTMLButtonElement, ButtonProps>(
              ({ className, variant = 'primary', size = 'md', ...props }, ref) => {
                const baseStyles = 'rounded-lg font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2';
                const variants = {
                  primary: 'bg-blue-600 text-white hover:bg-blue-700 focus:ring-blue-500',
                  secondary: 'bg-gray-200 text-gray-900 hover:bg-gray-300 focus:ring-gray-500',
                  outline: 'border border-gray-300 text-gray-700 hover:bg-gray-50 focus:ring-blue-500',
                };
                const sizes = {
                  sm: 'px-3 py-1.5 text-sm',
                  md: 'px-4 py-2 text-base',
                  lg: 'px-6 py-3 text-lg',
                };

                return (
                  <button
                    ref={ref}
                    className={`${baseStyles} ${variants[variant]} ${sizes[size]} ${className || ''}`}
                    {...props}
                  />
                );
              }
            );
            Button.displayName = 'Button';
    lib/:
      auth.ts:
        template: |
          import type { NextAuthOptions } from 'next-auth';
          import CredentialsProvider from 'next-auth/providers/credentials';
          import { prisma } from '@/lib/prisma';
          import bcrypt from 'bcryptjs';

          export const authOptions: NextAuthOptions = {
            providers: [
              CredentialsProvider({
                name: 'Credentials',
                credentials: {
                  email: { label: 'Email', type: 'email' },
                  password: { label: 'Password', type: 'password' },
                },
                async authorize(credentials) {
                  if (!credentials?.email || !credentials?.password) return null;
                  const user = await prisma.user.findUnique({ where: { email: credentials.email } });
                  if (!user || !user.password) return null;
                  const isValid = await bcrypt.compare(credentials.password, user.password);
                  if (!isValid) return null;
                  return { id: user.id, email: user.email, name: user.name };
                },
              }),
            ],
            session: { strategy: 'jwt' },
            pages: { signIn: '/login' },
            callbacks: {
              async session({ token, session }) {
                if (token && session.user) {
                  session.user.id = token.sub!;
                }
                return session;
              },
            },
          };
        condition: "authProvider === 'next-auth'"
      prisma.ts:
        template: |
          import { PrismaClient } from '@prisma/client';

          const globalForPrisma = globalThis as unknown as { prisma: PrismaClient };
          export const prisma = globalForPrisma.prisma || new PrismaClient();
          if (process.env.NODE_ENV !== 'production') globalForPrisma.prisma = prisma;
        condition: "database === 'postgresql' || database === 'mysql'"
      db.ts:
        template: |
          import Database from 'better-sqlite3';
          import { drizzle } from 'drizzle-orm/better-sqlite3';
          import * as schema from '@/lib/schema';

          const sqlite = new Database('data.db');
          export const db = drizzle(sqlite, { schema });
        condition: "database === 'sqlite'"
      utils.ts:
        template: |
          import { type ClassValue, clsx } from 'clsx';
          import { twMerge } from 'tailwind-merge';

          export function cn(...inputs: ClassValue[]) {
            return twMerge(clsx(inputs));
          }

          export function formatDate(date: Date | string): string {
            return new Date(date).toLocaleDateString('en-US', {
              year: 'numeric', month: 'long', day: 'numeric',
            });
          }
    types/:
      index.ts:
        template: |
          export interface User {
            id: string;
            name: string;
            email: string;
            role: 'admin' | 'user';
            createdAt: string;
            updatedAt: string;
          }

          export interface ApiResponse<T = unknown> {
            data?: T;
            error?: string;
            message?: string;
          }
  prisma/:
    schema.prisma:
      template: |
        datasource db {
          provider = "<%= database %>"
          url      = env("DATABASE_URL")
        }

        generator client {
          provider = "prisma-client-js"
        }

        model User {
          id        String   @id @default(cuid())
          name      String?
          email     String   @unique
          password  String?
          image     String?
          role      String   @default("user")
          createdAt DateTime @default(now())
          updatedAt DateTime @updatedAt
        }

        model Session {
          id           String   @id @default(cuid())
          sessionToken String   @unique
          userId       String
          expires      DateTime
          user         User     @relation(fields: [userId], references: [id], onDelete: Cascade)
        }

        model Account {
          id                String  @id @default(cuid())
          userId            String
          type              String
          provider          String
          providerAccountId String
          refresh_token     String?
          access_token      String?
          expires_at        Int?
          token_type        String?
          scope             String?
          id_token          String?
          session_state     String?
          user              User    @relation(fields: [userId], references: [id], onDelete: Cascade)

          @@unique([provider, providerAccountId])
        }
  public/:
    favicon.ico:
      template: ''
  e2e/:
    example.spec.ts:
      template: ''
      condition: "includeE2E"

dependencies:
  dependencies:
    next: ^14.2.0
    react: ^18.3.0
    react-dom: ^18.3.0
    next-auth: ^4.24.0
    '@prisma/client': ^5.14.0
    bcryptjs: ^2.4.3
    clsx: ^2.1.0
    tailwind-merge: ^2.3.0
    zod: ^3.23.0
  devDependencies:
    typescript: ^5.4.0
    '@types/node': ^20.11.0
    '@types/react': ^18.3.0
    '@types/react-dom': ^18.3.0
    '@types/bcryptjs': ^2.4.6
    prisma: ^5.14.0
    tailwindcss: ^3.4.0
    postcss: ^8.4.0
    autoprefixer: ^10.4.0
    eslint: ^8.56.0
    eslint-config-next: ^14.2.0
    '@typescript-eslint/parser': ^7.0.0
    '@typescript-eslint/eslint-plugin': ^7.0.0
    prettier: ^3.2.0
    eslint-config-prettier: ^9.1.0
    '@playwright/test': ^1.44.0
    jest: ^29.7.0
    ts-jest: ^29.1.0
    '@testing-library/react': ^15.0.0
    '@testing-library/jest-dom': ^6.4.0

configs:
  tsconfig:
    compilerOptions:
      target: ES2017
      lib:
        - dom
        - dom.iterable
        - esnext
      allowJs: true
      skipLibCheck: true
      strict: true
      noEmit: true
      esModuleInterop: true
      module: esnext
      moduleResolution: bundler
      resolveJsonModule: true
      isolatedModules: true
      jsx: preserve
      incremental: true
      plugins:
        - name: next
      paths:
        '@/*': ['./src/*']
    include:
      - next-env.d.ts
      - '**/*.ts'
      - '**/*.tsx'
    exclude:
      - node_modules

  eslint:
    extends:
      - next/core-web-vitals
      - plugin:@typescript-eslint/recommended
      - plugin:prettier/recommended
    parser: '@typescript-eslint/parser'
    plugins:
      - '@typescript-eslint'
    rules:
      '@typescript-eslint/no-explicit-any': error
      '@typescript-eslint/no-unused-vars':
        - error
        - argsIgnorePattern: ^_
    ignorePatterns:
      - .next
      - node_modules

  prettier:
    semi: true
    singleQuote: true
    tabWidth: 2
    trailingComma: all
    printWidth: 100

  jest:
    preset: ts-jest
    testEnvironment: jsdom
    roots:
      - <rootDir>/src
    testMatch:
      - '**/*.test.ts'
      - '**/*.test.tsx'
    moduleNameMapper:
      '^@/(.*)$': <rootDir>/src/$1
      '\\.(css|less|scss)$': identity-obj-proxy

  dockerCompose:
    services:
      app:
        build: .
        ports:
          - 3000:3000
        environment:
          NODE_ENV: development
        depends_on:
          - postgres
      postgres:
        image: postgres:16-alpine
        environment:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        volumes:
          - pgdata:/var/lib/postgresql/data
    volumes:
      pgdata:

  dockerfile:
    content: |
      FROM node:20-alpine AS base
      FROM base AS deps
      WORKDIR /app
      COPY package.json package-lock.json* pnpm-lock.yaml* ./
      RUN npm ci
      FROM base AS builder
      WORKDIR /app
      COPY --from=deps /app/node_modules ./node_modules
      COPY . .
      RUN npm run build
      FROM base AS runner
      WORKDIR /app
      ENV NODE_ENV production
      RUN addgroup --system --gid 1001 nodejs
      RUN adduser --system --uid 1001 nextjs
      COPY --from=builder /app/public ./public
      COPY --from=builder --chown=nextjs:nodejs /app/.next/standalone ./
      COPY --from=builder --chown=nextjs:nodejs /app/.next/static ./.next/static
      USER nextjs
      EXPOSE 3000
      ENV PORT 3000
      CMD ["node", "server.js"]

  envExample: {}
  gitignore: {}
  editorconfig: {}

contracts:
  schemaFormat: zod
  generateTests: true
  generateOpenAPI: true
  modules:
    - name: users
      version: 1.0.0
      description: User management
      interfaces:
        - name: IUserService
          methods:
            - name: findAll
              params: []
              returns: Promise<User[]>
            - name: findById
              params:
                - name: id
                  type: string
              returns: Promise<User | null>
            - name: create
              params:
                - name: data
                  type: CreateUserDto
              returns: Promise<User>
            - name: update
              params:
                - name: id
                  type: string
                - name: data
                  type: UpdateUserDto
              returns: Promise<User>
            - name: delete
              params:
                - name: id
                  type: string
              returns: Promise<void>
      events:
        - name: user.created
          payload: userId: string; email: string
        - name: user.updated
          payload: userId: string; changes: string[]
        - name: user.deleted
          payload: userId: string

adrs:
  autoGenerate: true
  templates:
    - title: Framework Selection
    - title: Database Selection
    - title: Architecture Decision
    - title: Authentication Strategy
    - title: Testing Strategy

postProcess:
  - command: git init
    description: Initialize git repository
  - command: npm install
    description: Install dependencies
    condition: "!skipInstall"
    timeout: 180000
  - command: npx prisma generate
    description: Generate Prisma client
    condition: "database === 'postgresql' || database === 'mysql'"
