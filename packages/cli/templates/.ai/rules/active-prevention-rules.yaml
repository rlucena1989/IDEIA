version: 1
rules:
  - id: no-hardcoded-local-paths
    severity: critical
    description: 'Do not allow local absolute paths generated by AI.'
    appliesTo: ['**/*.js', '**/*.ts', '**/*.sh', '**/*.ps1', '**/*.bat', '**/*.json']
    forbiddenPatterns: ['/home/user/', '/Users/', "C:\\Users\\"]
    remediation: 'Use path.resolve, __dirname, process.cwd.'
  - id: no-shell-copy-in-cross-platform-code
    severity: high
    description: 'Do not use shell copy commands in cross-platform installer logic.'
    forbiddenPatterns: ['cp -r', 'spawnSync("cp"', "spawnSync('cp'", 'xcopy', 'robocopy']
    remediation: 'Use fs.cpSync or safe copy util.'
  - id: human-work-preservation
    severity: critical
    description: 'Existing human-authored files must not be overwritten without --force and backup.'
    remediation: 'Use safe copy by default.'
