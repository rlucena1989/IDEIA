version: '3.8'

services:
  nats:
    image: nats:2.10-alpine
    container_name: ideia-nats
    ports:
      - '4222:4222' # NATS client port
      - '8222:8222' # NATS monitoring port
      - '6222:6222' # NATS cluster port
      - '7777:7777' # Leaf node connections
    command: >
      -js
      -m 8222
      --store_dir /data
      --jetstream
      sd /data
    volumes:
      - nats-data:/data
    environment:
      - NATS_SERVER_NAME=ideia-nats
      - NATS_MONITOR_PORT=8222
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:8222/varz']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - ideia-network
    restart: unless-stopped

  nats-exporter:
    image: natsio/prometheus-nats-exporter:latest
    container_name: ideia-nats-exporter
    ports:
      - '7778:7778'
    command: >
      -connz
      -routez
      -subz
      -varz
      -http http://nats:8222
    depends_on:
      - nats
    networks:
      - ideia-network
    restart: unless-stopped

volumes:
  nats-data:
    driver: local

networks:
  ideia-network:
    driver: bridge
