# IDEIA NATS Server Configuration
port: 4222
monitoring_port: 8222
cluster_port: 6222
leafnode_port: 7777

server_name: ideia-nats

jetstream {
  store_dir: /data
  max_memory_store: 256MB
  max_file_store: 1GB
}

max_payload: 1MB
max_connections: 1000
write_deadline: "10s"
ping_interval: "30s"
ping_max: 3

logtime: true
log_file: /var/log/nats.log
trace: false
debug: false
