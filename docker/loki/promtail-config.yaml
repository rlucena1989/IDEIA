server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container_name
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
      - source_labels: ['__meta_docker_container_label_logging_jobname']
        target_label: job
      - source_labels: ['__meta_docker_container_label_logging_environment']
        target_label: environment
      - source_labels: ['__meta_docker_container_label_logging_application']
        target_label: application

  # System logs
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          environment: production
          __path__: /var/log/**/*.log

  # IDEIA application logs (JSON format)
  - job_name: ideia-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: ideia-app
          environment: production
          __path__: /var/log/ideia/**/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp
            service: service
            trace_id: trace_id
            span_id: span_id
            user_id: user_id
            error: error
      - labels:
          level:
          service:
          trace_id:
          span_id:
          user_id:
      - timestamp:
          source: timestamp
          format: RFC3339
