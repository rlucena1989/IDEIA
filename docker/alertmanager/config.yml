route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      repeat_interval: 10m
    - match:
        severity: warning
      receiver: 'default'
      repeat_interval: 1h

receivers:
  - name: 'default'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/REPLACE_ME'
        channel: '#ideia-alerts'
        text: '{{ range .Alerts }}*{{ .Labels.alertname }}* - {{ .Annotations.description }}\n{{ end }}'
        title: 'IDEIA Alert {{ .Status | toUpper }}'

  - name: 'critical'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/REPLACE_ME'
        channel: '#ideia-critical'
        text: '🚨 *CRITICAL* {{ .Labels.alertname }}\n{{ .Annotations.description }}\n{{ .Annotations.summary }}'
        title: '🚨 CRITICAL: {{ .Labels.alertname }}'
    email_configs:
      - to: 'oncall@ideia.dev'
        from: 'alerts@ideia.dev'
        smarthost: 'smtp.example.com:587'

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname']

global:
  resolve_timeout: 5m
