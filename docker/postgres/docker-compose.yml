version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ideia-postgres
    environment:
      POSTGRES_DB: ideia
      POSTGRES_USER: ideia
      POSTGRES_PASSWORD: ideia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ideia"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
