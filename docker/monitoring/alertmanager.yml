route:
  receiver: 'default'
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: 'warnings'
      repeat_interval: 4h

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://host.docker.internal:9090/api/alerts'
        send_resolved: true
  - name: 'critical'
    webhook_configs:
      - url: 'http://host.docker.internal:9090/api/alerts'
        send_resolved: true
  - name: 'warnings'
    webhook_configs:
      - url: 'http://host.docker.internal:9090/api/alerts'
        send_resolved: false

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname', 'instance']
