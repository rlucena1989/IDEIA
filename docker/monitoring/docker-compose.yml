version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: ideia-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped
    networks:
      - ideia-monitoring

  grafana:
    image: grafana/grafana:10.2.0
    container_name: ideia-grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ../grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=ideia_admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_AUTH_ANONYMOUS_ENABLED=true
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - ideia-monitoring

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: ideia-alertmanager
    volumes:
      - ../alertmanager/config.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped
    networks:
      - ideia-monitoring

  node-exporter:
    image: prom/node-exporter:v1.6.0
    container_name: ideia-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    restart: unless-stopped
    networks:
      - ideia-monitoring

volumes:
  prometheus_data:
  grafana_data:

networks:
  ideia-monitoring:
    driver: bridge
