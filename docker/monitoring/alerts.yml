groups:
  - name: ideia_alerts
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP error rate ({{ $value | humanizePercentage }})"
          description: "Error rate is {{ $value | humanizePercentage }} above 5% threshold for 2 minutes"

      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_ms_bucket[5m])) by (le)) > 5000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High request latency (p95 > 5s)"
          description: "95th percentile latency is {{ $value }}ms, above 5000ms threshold"

      - alert: LowCacheHitRate
        expr: cache_hit_ratio < 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low cache hit rate ({{ $value | humanizePercentage }})"
          description: "Cache hit rate is {{ $value | humanizePercentage }}, below 50% threshold"

      - alert: HighMemoryUsage
        expr: memory_heap_used_bytes / memory_heap_limit_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage ({{ $value | humanizePercentage }})"
          description: "Heap memory usage is {{ $value | humanizePercentage }} above 85% threshold"

      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} down"
          description: "Instance {{ $labels.instance }} has been down for more than 1 minute"

      - alert: SLOBreach
        expr: slo_status == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "SLO breached for {{ $labels.name }}"
          description: "SLO {{ $labels.name }} has dropped below target ({{ $labels.current }}% < {{ $labels.target }}%)"
