id: secrets-management
title: "Secrets Management (Vault, AWS Secrets Manager)"
category: security
tags: ["secrets", "vault", "secrets-manager", "vault", "encryption"]
summary: "Ferramentas e praticas para gerenciar secrets (senhas, tokens, chaves) de forma segura."
content: |
  Problemas: secrets em Git, .env versionado, hardcoded, logs. Solucoes: HashiCorp Vault (dinamico, auditado, renew), AWS Secrets Manager (integrado AWS), Azure Key Vault, Kubernetes Secrets (base64 apenas, usar SOPS ou Sealed Secrets). Praticas: rotacao automatica, acesso com minimo privilegio, audit logging, nunca loggar secrets. Para dev: dotenv, .env.local ignorado.
