<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Optimizer Dashboard</title>
  <link rel="stylesheet" href="./dashboard.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="container">
    <header class="header">
      <div>
        <h1>Optimizer Dashboard</h1>
        <p id="subtitle">Decision Optimization Layer</p>
      </div>
      <div class="actions">
        <button id="approveBtn" class="btn btn-approve">Approve</button>
        <button id="rejectBtn" class="btn btn-reject">Reject</button>
        <button id="rollbackBtn" class="btn btn-rollback">Rollback</button>
        <button id="timelineBtn" class="btn">Timeline</button>
        <button id="compareBtn" class="btn">Compare</button>
        <button id="scorecardBtn" class="btn btn-scorecard">Scorecard</button>
        <button id="refreshBtn" class="btn btn-primary">Refresh</button>
      </div>
    </header>

    <section id="status" class="status">Ready.</section>

    <section class="summary-cards" id="summaryCards">
      <div class="summary-card"><div class="value" id="s-risk">-</div><div class="label">Risk Score</div></div>
      <div class="summary-card"><div class="value" id="s-quality">-</div><div class="label">Quality Score</div></div>
      <div class="summary-card"><div class="value" id="s-mode">-</div><div class="label">Execution Mode</div></div>
      <div class="summary-card"><div class="value" id="s-task">-</div><div class="label">Last Task</div></div>
    </section>

    <section id="scorecardPanel" class="scorecard-panel" style="display:none">
      <div class="scorecard-header">
        <h2>Maturidade do Projeto</h2>
        <div id="maturityGauge"></div>
      </div>
      <div id="scorecardCats" class="scorecard-cats"></div>
    </section>

    <section class="grid">
      <article class="card wide">
        <h2>Score Overview</h2>
        <div class="chart-row">
          <div class="chart-box"><canvas id="riskChart" width="160" height="160"></canvas><div class="chart-label">Risk</div></div>
          <div class="chart-box"><canvas id="qualityChart" width="160" height="160"></canvas><div class="chart-label">Quality</div></div>
          <div class="chart-box"><canvas id="historyChart" width="300" height="160"></canvas><div class="chart-label">Score History</div></div>
        </div>
      </article>

      <article class="card">
        <h2>Decision</h2>
        <pre id="decision" class="empty">No data</pre>
      </article>

      <article class="card">
        <h2>Memory</h2>
        <pre id="memory" class="empty">No data</pre>
      </article>

      <article class="card wide">
        <h2>Patch</h2>
        <pre id="patch" class="empty">No data</pre>
      </article>

      <article class="card wide">
        <h2>Diff</h2>
        <pre id="diff" class="empty">No data</pre>
      </article>

      <article class="card full">
        <h2>Execution History</h2>
        <div id="timeline" class="timeline"></div>
      </article>
    </section>
  </div>
  <script src="./dashboard.js"></script>
</body>
</html>
