name: migration
version: 1.0.0
displayName: "Migration Context"
description: >
  Contexto especializado para migracoes de codigo, frameworks, bancos ou
  infraestrutura. Inclui breaking changes catalog, rollout steps e rollback plan.
author: IDEIA
created: 2026-07-22T14:00:00Z
updated: 2026-07-22T14:00:00Z
tags: [migration, upgrade, breaking-change]
categories: [development, maintenance]
level: advanced
variables:
  - name: from_version
    type: string
    description: "Versao de origem"
    required: true
  - name: to_version
    type: string
    description: "Versao de destino"
    required: true
  - name: migration_type
    type: enum
    description: "Tipo de migracao"
    required: true
    enum: [framework, database, language, library, infrastructure, data]
  - name: rollback_strategy
    type: string
    description: "Estrategia de rollback"
    required: false
sections:
  - id: migration_context
    title: "Contexto da Migracao"
    format: markdown
    priority: P0
    content: |
      ## Migracao: {{from_version}} -> {{to_version}}
      - **Tipo:** {{migration_type}}
      - **Rollback:** {{rollback_strategy}}
  - id: breaking_changes_catalog
    title: "Catalogo de Breaking Changes"
    format: markdown
    priority: P1
    content: |
      ## Breaking Changes {{from_version}} -> {{to_version}}
      - Identificar APIs removidas ou renomeadas
      - Identificar mudancas de comportamento
      - Identificar deprecacoes que viram erro
      - Identificar mudancas de configuracao
      - Identificar mudancas de schema/database
  - id: migration_steps
    title: "Passos de Migracao"
    format: markdown
    priority: P1
    content: |
      ## Plano de Migracao
      1. Preparacao: ler changelog, identificar breaking changes
      2. Backup: garantir backup de codigo e dados
      3. Ambiente: criar branch de migracao
      4. Dependencias: atualizar gradualmente com resolucao de conflitos
      5. Codigo: aplicar mudancas necessarias
      6. Testes: validar cada componente migrado
      7. Integracao: testar fluxos completos
      8. Documentacao: atualizar docs e changelog
  - id: rollback_plan
    title: "Plano de Rollback"
    format: markdown
    priority: P2
    content: |
      ## Plano de Rollback
      - Estrategia: {{rollback_strategy}}
      - Pontos de checkpoint em cada fase
      - Testes de rollback antes da migracao
      - Comunicacao de falha para stakeholders
  - id: verification_checklist
    title: "Checklist de Verificacao"
    format: markdown
    priority: P2
    content: |
      ## Checklist de Verificacao
      - [ ] Build passa sem erros
      - [ ] Testes unitarios passam
      - [ ] Testes de integracao passam
      - [ | Testes E2E passam
      - [ ] Performance baseline mantida
      - [ ] Logs sem warnings de deprecated
      - [ ] Documentacao atualizada
dependencies:
  - pack: ideia-introduction
    version: ^1.0.0
    required: true
slicing:
  - maxTokens: 4096
    strategy: priority
    maxSections: 3
  - maxTokens: 8192
    strategy: priority
    maxSections: 5
