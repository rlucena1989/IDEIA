name: performance
version: 1.0.0
displayName: "Performance Optimization Context"
description: >
  Contexto especializado para otimizacao de performance. Inclui profiling,
  estrategias de otimizacao por bottleneck, benchmarking e prevencao de regressao.
author: IDEIA
created: 2026-07-22T14:00:00Z
updated: 2026-07-22T14:00:00Z
tags: [perf, optimization, benchmarking]
categories: [performance, quality]
level: advanced
variables:
  - name: perf_goal
    type: string
    description: "Objetivo de performance"
    required: true
  - name: bottleneck_area
    type: enum
    description: "Area do gargalo"
    required: true
    enum: [cpu, memory, io, network, database, rendering, bundle]
  - name: include_baseline
    type: boolean
    description: "Incluir baseline de performance"
    default: true
sections:
  - id: performance_context
    title: "Contexto de Performance"
    format: markdown
    priority: P0
    content: |
      ## Otimizacao: {{perf_goal}}
      - **Gargalo:** {{bottleneck_area}}
      - **Baseline:** {{include_baseline}}
  - id: profiling_guide
    title: "Guia de Profiling"
    format: markdown
    priority: P1
    content: |
      ## Profiling por Area
      - **CPU:** Node --cpu-prof, Chrome DevTools, clinic flame
      - **Memory:** heap snapshots, --trace-gc, clinic heapprofiler
      - **IO:** fs.statSync vs fs.promises, streams vs buffered
      - **Network:** HAR files, Chrome Network tab, k6 load test
      - **Database:** EXPLAIN ANALYZE, slow query log, index usage
      - **Rendering:** React DevTools Profiler, Layout thrashing
      - **Bundle:** webpack-bundle-analyzer, esbuild meta, tree shaking
  - id: optimization_strategies
    title: "Estrategias de Otimizacao"
    format: markdown
    priority: P1
    content: |
      ## Estrategias por Gargalo
      ### CPU
      - Algoritmos eficientes (O(n) vs O(n^2))
      - Memoizacao e caching
      - Web Workers / Worker Threads
      - Debounce/Throttle para eventos frequentes
      ### Memory
      - Object pooling
      - Lazy loading
      - WeakRef para caches
      - Stream processing vs loading tudo em memoria
      ### Bundle
      - Code splitting (dynamic import)
      - Tree shaking configurado
      - Lodash por-modulo (lodash-es)
      - Polyfills sob demanda
  - id: benchmark_template
    title: "Template de Benchmark"
    format: markdown
    priority: P2
    content: |
      ## Template de Benchmark
      ```
      npx autocannon -c 100 -d 30 http://localhost:3000/api
      # Resultados esperados:
      # - Latency media < 200ms
      # - P99 < 500ms
      # - Throughput > 1000 req/s
      ```
  - id: regression_prevention
    title: "Prevencao de Regressao"
    format: markdown
    priority: P2
    content: |
      ## Prevencao de Regressao
      - Adicionar benchmark como teste CI
      - Thresholds com alerta (ex: latencia > 2x baseline)
      - Profile diff entre releases
dependencies:
  - pack: ideia-introduction
    version: ^1.0.0
    required: true
slicing:
  - maxTokens: 4096
    strategy: priority
    maxSections: 3
  - maxTokens: 8192
    strategy: priority
    maxSections: 5
