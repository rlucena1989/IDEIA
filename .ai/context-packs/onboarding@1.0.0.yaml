name: onboarding
version: 1.0.0
displayName: "Onboarding Context"
description: >
  Contexto especializado para onboarding de novos usuarios. Guia passo a passo
  pelos conceitos fundamentais, primeiros comandos e capacidades da IDEIA.
author: IDEIA
created: 2026-07-22T14:00:00Z
updated: 2026-07-22T14:00:00Z
tags: [onboarding, learning, tutorial, new-user]
categories: [onboarding, education]
level: beginner
variables:
  - name: user_role
    type: enum
    description: "Papel do usuario"
    default: developer
    enum: [developer, devops, manager, ai-agent, architect]
  - name: experience_level
    type: enum
    description: "Nivel de experiencia"
    default: beginner
    enum: [beginner, intermediate, advanced]
  - name: include_exercises
    type: boolean
    description: "Incluir exercicios praticos"
    default: true
sections:
  - id: welcome_and_context
    title: "Boas Vindas"
    format: markdown
    priority: P0
    content: |
      ## Bem-vindo a IDEIA!
      Ola! Seja bem-vindo(a) a IDEIA — a plataforma que transforma ideias em
      sistemas completos. Este context pack vai te guiar pelos primeiros passos.

      **Seu papel:** {{user_role}}
      **Seu nivel:** {{experience_level}}
  - id: core_concepts
    title: "Conceitos Fundamentais"
    format: markdown
    priority: P1
    content: |
      ## Conceitos Fundamentais
      1. **Agentes** — 6 especialistas (Analyst, Architect, Programmer, Reviewer, Tester, DevOps)
      2. **Comandos CLI** — 51 comandos (init, generate, audit, verify, etc.)
      3. **Context Packs** — Modulos de contexto para LLMs
      4. **Workflows** — Fluxos orquestrados de ponta a ponta
      5. **Gates** — 4 gates de qualidade (Commit, PR, Release, Sprint)
  - id: first_steps
    title: "Primeiros Passos"
    format: markdown
    priority: P1
    content: |
      ## Primeiros Passos
      1. `IDEIA init` — Crie seu primeiro projeto
      2. `IDEIA generate` — Gere componentes a partir de templates
      3. `IDEIA audit` — Execute auditores de qualidade
      4. `IDEIA verify` — Verifique compliance do projeto
      5. `IDEIA workflow run zero-to-deploy` — Fluxo completo
  - id: exercises
    title: "Exercicios"
    format: markdown
    priority: P2
    content: |
      ## Exercicios
      {{#if include_exercises}}
      1. Crie um projeto com `IDEIA init meu-projeto`
      2. Gere um componente `IDEIA generate component Button`
      3. Execute auditoria `IDEIA audit --ci`
      4. Explore os context packs em `.ai/context-packs/`
      5. Complete o tutorial `IDEIA tutorial start primeiro-projeto`
      {{/if}}
  - id: next_steps
    title: "Proximos Passos"
    format: markdown
    priority: P2
    content: |
      ## Proximos Passos
      - Explore todos os comandos: `IDEIA --help`
      - Leia o manifesto da IDEIA: `.ai/ideia-manifest.md`
      - Faca o tutorial interativo: `IDEIA tutorial list`
      - Junte-se a comunidade para compartilhar experiencias
dependencies:
  - pack: ideia-introduction
    version: ^1.0.0
    required: true
slicing:
  - maxTokens: 4096
    strategy: priority
    maxSections: 3
  - maxTokens: 8192
    strategy: priority
    maxSections: 5
