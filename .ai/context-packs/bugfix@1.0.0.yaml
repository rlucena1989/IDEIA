name: bugfix
version: 1.0.0
displayName: "Bug Fix Context"
description: >
  Contexto especializado para correcao de bugs. Fornece estrutura de diagnostico,
  padroes de fix, checklist de validacao e prevencao de regressao.
author: IDEIA
created: 2026-07-22T14:00:00Z
updated: 2026-07-22T14:00:00Z
tags: [debug, fix, quality, troubleshooting]
categories: [quality, development]
level: intermediate
variables:
  - name: bug_description
    type: string
    description: "Descricao do bug"
    required: true
  - name: severity
    type: enum
    description: "Severidade do bug"
    default: medium
    enum: [critical, high, medium, low]
  - name: affected_component
    type: string
    description: "Componente afetado"
    required: false
  - name: expected_behavior
    type: string
    description: "Comportamento esperado"
    required: true
  - name: actual_behavior
    type: string
    description: "Comportamento atual"
    required: true
  - name: reproduction_steps
    type: string
    description: "Passos para reproduzir"
    required: true
  - name: error_log
    type: string
    description: "Log de erro"
    required: false
sections:
  - id: bug_context
    title: "Contexto do Bug"
    format: markdown
    priority: P0
    content: |
      ## Bug: {{bug_description}}
      - **Severidade:** {{severity}}
      - **Componente:** {{affected_component}}
      - **Esperado:** {{expected_behavior}}
      - **Atual:** {{actual_behavior}}
  - id: reproduction
    title: "Reproducao"
    format: markdown
    priority: P0
    content: |
      ## Passos para Reproduzir
      {{reproduction_steps}}
      {{#if error_log}}
      ## Log de Erro
      ```
      {{error_log}}
      ```
      {{/if}}
  - id: diagnosis_framework
    title: "Framework de Diagnostico"
    format: markdown
    priority: P1
    content: |
      ## Framework de Diagnostico
      1. Isolar: determinar se o bug e reprodutivel isoladamente
      2. Causa raiz: identificar a origem (logica, estado, concorrencia, recurso)
      3. Impacto: avaliar escopo de afetados
      4. Cobertura: verificar se ha teste que pegaria o bug
  - id: fix_patterns
    title: "Padroes de Correcao"
    format: markdown
    priority: P1
    content: |
      ## Padroes de Correcao
      - Validacao de entrada: sanitizar dados antes do processamento
      - State management: garantir consistencia de estado
      - Error handling: capturar e tratar excecoes especificas
      - Race condition: usar locks ou operacoes atomicas
      - Resource leak: garantir cleanup em todos os paths
  - id: validation_checklist
    title: "Checklist de Validacao"
    format: markdown
    priority: P2
    content: |
      ## Checklist de Validacao
      - [ ] Bug nao reproduz apos correcao
      - [ ] Testes unitarios passam
      - [ ] Testes de integracao passam
      - [ ] Nenhum efeito colateral em componentes vizinhos
      - [ ] Logging adequado para diagnostico futuro
  - id: regression_prevention
    title: "Prevencao de Regressao"
    format: markdown
    priority: P2
    content: |
      ## Prevencao de Regressao
      - Adicionar teste unitario que cobre o cenario do bug
      - Adicionar teste de integracao se aplicavel
      - Documentar a causa raiz no ADR se a correcao alterou arquitetura
dependencies:
  - pack: ideia-introduction
    version: ^1.0.0
    required: true
slicing:
  - maxTokens: 4096
    strategy: priority
    maxSections: 3
  - maxTokens: 8192
    strategy: priority
    maxSections: 5
  - maxTokens: 32768
    strategy: priority
