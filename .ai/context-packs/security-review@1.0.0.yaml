name: security-review
version: 1.0.0
displayName: "Security Review Context"
description: >
  Contexto especializado para revisao de seguranca. Inclui OWASP Top 10,
  threat modeling, remediacao e testes de seguranca.
author: IDEIA
created: 2026-07-22T14:00:00Z
updated: 2026-07-22T14:00:00Z
tags: [security, audit, review, vulnerability]
categories: [security, quality]
level: advanced
variables:
  - name: review_scope
    type: string
    description: "Escopo da revisao"
    required: true
  - name: threat_model
    type: string
    description: "Modelo de ameacas (opcional)"
    required: false
  - name: compliance_standard
    type: enum
    description: "Padrao de compliance"
    required: false
    enum: [owasp, lgpd, soc2, pci, hipaa]
  - name: severity_threshold
    type: string
    description: "Threshold de severidade"
    default: high
sections:
  - id: scope_and_context
    title: "Escopo e Contexto"
    format: markdown
    priority: P0
    content: |
      ## Revisao de Seguranca: {{review_scope}}
      - **Modelo de ameacas:** {{threat_model}}
      - **Compliance:** {{compliance_standard}}
      - **Threshold:** {{severity_threshold}}
  - id: owasp_top10_checklist
    title: "Checklist OWASP Top 10"
    format: markdown
    priority: P1
    content: |
      ## OWASP Top 10 (2021)
      - [ ] A01: Broken Access Control
      - [ ] A02: Cryptographic Failures
      - [ ] A03: Injection (SQL, NoSQL, OS, LDAP)
      - [ ] A04: Insecure Design
      - [ ] A05: Security Misconfiguration
      - [ ] A06: Vulnerable Components
      - [ ] A07: Auth Failures
      - [ ] A08: Data Integrity Failures
      - [ ] A09: Logging & Monitoring
      - [ ] A10: SSRF
  - id: threat_modeling_template
    title: "Template de Threat Modeling"
    format: markdown
    priority: P1
    content: |
      ## Threat Modeling (STRIDE)
      | Categoria | Ameaca | Impacto | Mitigacao |
      |-----------|--------|---------|-----------|
      | Spoofing  | | | |
      | Tampering | | | |
      | Repudiation | | | |
      | Info Disclosure | | | |
      | DoS | | | |
      | Elevation of Privilege | | | |
  - id: security_testing_guide
    title: "Guia de Testes de Seguranca"
    format: markdown
    priority: P2
    content: |
      ## Testes de Seguranca
      - SAST: eslint-plugin-security, sonarjs
      - SCA: npm audit, snyk, dependency-check
      - Fuzzing: teste com entradas malformadas
      - Auth: JWT expiration, refresh rotation, rate limit
      - Input: sanitizacao em todas as entradas
  - id: reporting_template
    title: "Template de Relatorio"
    format: markdown
    priority: P2
    content: |
      ## Template de Relatorio
      - **Escopo:** {{review_scope}}
      - **Data:** {{current_date}}
      - **Vulnerabilidades encontradas:** N
        - Criticas: N
        - Altas: N
        - Medias: N
        - Baixas: N
      - **Recomendacoes:** ...
dependencies:
  - pack: ideia-introduction
    version: ^1.0.0
    required: true
slicing:
  - maxTokens: 4096
    strategy: priority
    maxSections: 3
  - maxTokens: 8192
    strategy: priority
    maxSections: 5
