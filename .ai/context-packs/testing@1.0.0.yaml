name: testing
version: 1.0.0
displayName: "Testing Context"
description: >
  Contexto especializado para criacao e execucao de testes. Suporta unitarios,
  integracao, E2E, contrato, mutacao e performance com estrategias e templates.
author: IDEIA
created: 2026-07-22T14:00:00Z
updated: 2026-07-22T14:00:00Z
tags: [testing, quality, coverage]
categories: [testing, quality]
level: intermediate
variables:
  - name: test_type
    type: enum
    description: "Tipo de teste"
    default: unit
    enum: [unit, integration, e2e, contract, mutation, performance]
  - name: framework_test
    type: string
    description: "Framework de teste"
    default: jest
  - name: coverage_target
    type: number
    description: "Cobertura alvo (%)"
    default: 80
  - name: module_under_test
    type: string
    description: "Modulo sob teste"
    required: true
sections:
  - id: testing_context
    title: "Contexto de Testes"
    format: markdown
    priority: P0
    content: |
      ## Testes: {{module_under_test}}
      - **Tipo:** {{test_type}}
      - **Framework:** {{framework_test}}
      - **Cobertura alvo:** {{coverage_target}}%
  - id: test_strategy_template
    title: "Template de Estrategia"
    format: markdown
    priority: P1
    content: |
      ## Estrategia de Testes para {{module_under_test}}
      ### Unitarios
      - Mock dependencias externas
      - Testar casos de borda
      - Cobertura minima: {{coverage_target}}%
      ### Integracao
      - Testar fluxos reais com dependencias reais
      - Database: usar instancia de teste
      - API: usar supertest ou similar
      ### E2E
      - Fluxos criticos do usuario
      - Setup/teardown automatizado
      - Screenshots para debug visual
  - id: mocking_guidelines
    title: "Diretrizes de Mocking"
    format: markdown
    priority: P1
    content: |
      ## Diretrizes de Mocking
      - Mock apenas o que esta fora do escopo do teste
      - Preferir injecao de dependencia a mocking global
      - Usar jest.fn() para funcoes simples
      - Usar mocks manuais para modulos complexos
      - NUNCA mock o que voce nao possui
  - id: fixture_template
    title: "Template de Fixture"
    format: code
    priority: P2
    content: |
      // {{module_under_test}}.test.ts
      import { describe, it, expect, beforeEach } from '{{framework_test}}';
      import { {{module_under_test}} } from './{{module_under_test}}';

      describe('{{module_under_test}}', () => {
        beforeEach(() => {
          // setup
        });

        it('should handle basic case', () => {
          // arrange
          // act
          // assert
        });
      });
  - id: ci_integration_notes
    title: "Notas de CI"
    format: markdown
    priority: P2
    content: |
      ## Integracao CI
      - Comando: `npx {{framework_test}} --coverage`
      - Threshold coverage: {{coverage_target}}%
      - Parallel: dividir em shards se lento
      - Cache de node_modules para speed
dependencies:
  - pack: ideia-introduction
    version: ^1.0.0
    required: true
slicing:
  - maxTokens: 4096
    strategy: priority
    maxSections: 3
  - maxTokens: 8192
    strategy: priority
    maxSections: 5
