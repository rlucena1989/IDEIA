apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: ideia
data:
  nats.conf: |
    pid_file: "/var/run/nats/nats.pid"
    http_port: 8222
    
    # JetStream
    jetstream {
      store_dir = "/data/jetstream"
      max_memory_store: 1GB
      max_file_store: 10GB
    }
    
    # Monitoring
    monitoring {
      http: 8222
    }
    
    # Logging
    log_file: "/var/log/nats/nats.log"
    logtime: true
    debug: false
    trace: false
    
    # Limits
    max_payload: 8MB
    max_control_line: 2048
    
    # TLS
    tls {
      cert_file: "/etc/nats/certs/server.crt"
      key_file: "/etc/nats/certs/server.key"
      ca_file: "/etc/nats/certs/ca.crt"
      verify: true
    }
---
apiVersion: v1
kind: Service
metadata:
  name: ideia-nats
  namespace: ideia
  labels:
    app: ideia-nats
spec:
  ports:
    - port: 4222
      name: nats
      targetPort: 4222
    - port: 8222
      name: monitor
      targetPort: 8222
    - port: 7777
      name: leafnode
      targetPort: 7777
  selector:
    app: ideia-nats
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ideia-nats
  namespace: ideia
spec:
  serviceName: ideia-nats
  replicas: 3
  selector:
    matchLabels:
      app: ideia-nats
  template:
    metadata:
      labels:
        app: ideia-nats
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - ideia-nats
                topologyKey: kubernetes.io/hostname
      containers:
        - name: nats
          image: nats:2.10-alpine
          ports:
            - containerPort: 4222
              name: nats
            - containerPort: 8222
              name: monitor
            - containerPort: 7777
              name: leafnode
          command:
            - "nats-server"
            - "-c"
            - "/etc/nats/nats.conf"
          volumeMounts:
            - name: config-volume
              mountPath: /etc/nats
            - name: nats-storage
              mountPath: /data
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: 8222
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8222
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config-volume
          configMap:
            name: nats-config
  volumeClaimTemplates:
    - metadata:
        name: nats-storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
        storageClassName: fast-ssd
