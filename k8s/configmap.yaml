apiVersion: v1
kind: ConfigMap
metadata:
  name: ideia-config
  namespace: ideia
data:
  NODE_ENV: "production"
  EVENT_BUS_TYPE: "nats"
  NATS_URL: "nats://ideia-nats:4222"
  DATABASE_URL: "postgresql://ideia:$(POSTGRES_PASSWORD)@ideia-postgres:5432/ideia"
  LOG_LEVEL: "info"
  ENABLE_METRICS: "true"
  ENABLE_TRACING: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ideia-config
  namespace: ideia-staging
data:
  NODE_ENV: "staging"
  EVENT_BUS_TYPE: "nats"
  NATS_URL: "nats://ideia-nats:4222"
  DATABASE_URL: "postgresql://ideia:$(POSTGRES_PASSWORD)@ideia-postgres:5432/ideia"
  LOG_LEVEL: "debug"
  ENABLE_METRICS: "true"
  ENABLE_TRACING: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ideia-config
  namespace: ideia-dev
data:
  NODE_ENV: "development"
  EVENT_BUS_TYPE: "auto"
  NATS_URL: "nats://ideia-nats:4222"
  DATABASE_URL: "postgresql://ideia:$(POSTGRES_PASSWORD)@ideia-postgres:5432/ideia"
  LOG_LEVEL: "debug"
  ENABLE_METRICS: "true"
  ENABLE_TRACING: "false"
