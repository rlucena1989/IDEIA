apiVersion: apps/v1
kind: Deployment
metadata:
  name: ideia-backend
  namespace: ideia
  labels:
    app: ideia-backend
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ideia-backend
  template:
    metadata:
      labels:
        app: ideia-backend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - ideia-backend
                topologyKey: kubernetes.io/hostname
      containers:
        - name: ideia-backend
          image: ghcr.io/ideia/ideia-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              name: http
              protocol: TCP
            - containerPort: 9464
              name: otlp
              protocol: TCP
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: ideia-config
                  key: NODE_ENV
            - name: EVENT_BUS_TYPE
              valueFrom:
                configMapKeyRef:
                  name: ideia-config
                  key: EVENT_BUS_TYPE
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: ideia-config
                  key: NATS_URL
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: ideia-config
                  key: DATABASE_URL
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ideia-secrets
                  key: postgres-password
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: ideia-config
                  key: LOG_LEVEL
            - name: ENABLE_METRICS
              valueFrom:
                configMapKeyRef:
                  name: ideia-config
                  key: ENABLE_METRICS
            - name: ENABLE_TRACING
              valueFrom:
                configMapKeyRef:
                  name: ideia-config
                  key: ENABLE_TRACING
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: cache
              mountPath: /app/cache
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ideia-backend-hpa
  namespace: ideia
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ideia-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
