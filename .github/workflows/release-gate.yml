# Gate 3 — Release Quality Gates
# Triggered on push to main (after merge) or manual workflow_dispatch
name: Release Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  NATS_URL: nats://localhost:4222
  DATABASE_URL: postgresql://ideia:ideia@localhost:5432/ideia

jobs:
  full-tests:
    name: Full Test Suite
    runs-on: ubuntu-latest
    services:
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
        options: >-
          --health-cmd "wget --quiet --tries=1 --spider http://localhost:8222/varz || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: ideia
          POSTGRES_USER: ideia
          POSTGRES_PASSWORD: ideia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ideia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Unit tests with coverage
        run: npx jest --passWithNoTests --coverage
      - name: Integration tests
        run: npx jest packages/* --testPathPattern='integration' --no-coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: full-coverage
          path: coverage/
          retention-days: 30

  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Run benchmarks
        run: |
          if [ -f scripts/benchmark-runner.ts ]; then
            npx tsx scripts/benchmark-runner.ts
          else
            echo "⚠️ scripts/benchmark-runner.ts not found, skipping"
          fi

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Generate CycloneDX SBOM
        run: npx tsx scripts/generate-sbom.ts
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom*.json
          retention-days: 90

  security-full:
    name: Full Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: npm audit
        run: npm audit
        continue-on-error: true
      - name: Automated pentest
        run: npx tsx scripts/security-pentest.ts --ci

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [full-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Full TypeScript build
        run: npx tsc -b
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: packages/*/dist/
          retention-days: 7

  changelog:
    name: Verify Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Check CHANGELOG.md is updated
        run: |
          if git diff --name-only HEAD~1..HEAD | grep -q 'CHANGELOG.md'; then
            echo "✅ CHANGELOG.md was updated in this merge"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            CURRENT=$(git log -1 --format=%H)
            if git log "$TAG..$CURRENT" --oneline | head -5 | grep -q .; then
              echo "⚠️ CHANGELOG.md may need updating (commits since $TAG)"
            else
              echo "✅ No new commits since last tag, changelog check skipped"
            fi
          fi

  e2e:
    name: E2E Tests (Placeholder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: E2E placeholder
        run: echo "⚠️ E2E tests not yet implemented — placeholder passing"

  notify:
    name: Release Gate Summary
    needs: [full-tests, performance, sbom, security-full, build, changelog, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize results
        run: |
          echo "## Release Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for job in full-tests performance sbom security-full build changelog e2e; do
            result="${{ needs[format('{0}', job)].result }}"
            echo "- **$job**: $result" >> $GITHUB_STEP_SUMMARY
          done
