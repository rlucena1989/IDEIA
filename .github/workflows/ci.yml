name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  EVENT_BUS_TYPE: auto
  NATS_URL: nats://localhost:4222
  DATABASE_URL: postgresql://ideia:ideia@localhost:5432/ideia

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Upload tsbuildinfo
        uses: actions/cache@v4
        with:
          path: packages/*/tsconfig.tsbuildinfo
          key: tsbuildinfo-${{ github.sha }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx eslint packages/ --ext .ts --max-warnings 600

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Cache tsbuildinfo
        uses: actions/cache@v4
        with:
          path: packages/*/tsconfig.tsbuildinfo
          key: tsbuildinfo-${{ github.sha }}
      - run: npx jest --no-coverage --shard=${{ matrix.shard }}/4

  integration-tests:
    runs-on: ubuntu-latest
    services:
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
        options: >-
          --health-cmd "wget --quiet --tries=1 --spider http://localhost:8222/varz || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: ideia
          POSTGRES_USER: ideia
          POSTGRES_PASSWORD: ideia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ideia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx jest --no-coverage --testPathPattern='tests/integration|tests/edge-cases'

  docs-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx tsx scripts/docs-sync.ts --ci

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high || true
      - name: Run security pentest
        run: npx tsx scripts/security-pentest.ts --ci

  notify:
    needs: [typecheck, lint, unit-tests, integration-tests, docs-verify, security-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check build status
        run: |
          echo "typecheck=${{ needs.typecheck.result }}"
          echo "lint=${{ needs.lint.result }}"
          echo "unit=${{ needs.unit-tests.result }}"
          echo "integration=${{ needs.integration-tests.result }}"
          echo "docs=${{ needs.docs-verify.result }}"
          echo "security=${{ needs.security-audit.result }}"
