# Continuous Integration
# Triggered on push to any branch
name: CI

on:
  push:
    branches-ignore: [main]

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx eslint packages/ --max-warnings 600

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx tsc -b --force

  quick-tests:
    name: Quick Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Run tests for core packages
        run: npx jest --passWithNoTests --testPathPattern='packages/(cli|core|logger|event-bus|contracts)'

  pre-commit-check:
    name: Pre-commit Simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Check for .only in tests
        run: |
          ONLY_FILES=$(grep -r '\.only' packages/*/__tests__/*.ts packages/*/src/__tests__/*.ts 2>/dev/null || true)
          if [ -n "$ONLY_FILES" ]; then
            echo "❌ Found .only in tests:"
            echo "$ONLY_FILES"
            exit 1
          fi
          echo "✅ No .only found in tests"
      - name: Check no console.log in production
        run: |
          CONSOLE_FILES=$(grep -r 'console.log' packages/*/src/*.ts 2>/dev/null || true)
          if [ -n "$CONSOLE_FILES" ]; then
            echo "⚠️ Console.log found in production code:"
            echo "$CONSOLE_FILES"
          fi
          echo "✅ Pre-commit checks complete"
