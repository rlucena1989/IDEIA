name: Complexity Check

on:
  pull_request:
    paths:
      - 'packages/**/*.ts'
      - 'packages/**/*.tsx'
  push:
    branches: [main, develop]

jobs:
  complexity:
    name: Cyclomatic Complexity Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - run: npm ci
      
      - name: Run ESLint with complexity rules
        run: |
          npx eslint packages/ --ext .ts --format json --output-file complexity-report.json || true
          
      - name: Generate complexity report
        run: |
          npx tsx scripts/complexity-report.ts --input complexity-report.json --output complexity-summary.md
          
      - name: Upload complexity report
        uses: actions/upload-artifact@v4
        with:
          name: complexity-report
          path: |
            complexity-report.json
            complexity-summary.md
          retention-days: 30
          
      - name: Comment PR with complexity summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('complexity-summary.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
