# Auto-generated by IDEIA generate-all-workflows
name: Release Auto

on:
  push:
    tags:
      - 'v*'

jobs:
  docs-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Verify documentation sync
        run: npx tsx scripts/docs-sync.ts --ci

  quality-gates:
    needs: docs-verify
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npx eslint . --max-warnings=0
      - name: Test
        run: npx jest --passWithNoTests
      - name: Build
        run: npx tsc -b
      - name: Security
        run: npm audit --audit-level=high

  release-notes:
    needs: quality-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate Release Notes
        run: |
          echo "## Release ${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          git log --oneline --format="* %s" $(git describe --tags --abbrev=0 HEAD^)..HEAD >> RELEASE_NOTES.md || true
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  deploy-staging:
    needs: release-notes
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploying ${GITHUB_REF_NAME} to staging"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploying ${GITHUB_REF_NAME} to production"

