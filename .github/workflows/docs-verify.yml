# Auto-generated by IDEIA — Docs Sync Enforcement
name: Docs Verify

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/**'
      - 'docs/**'
      - 'scripts/docs-sync.ts'
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'docs/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Verify Documentation vs Code
        run: npx tsx scripts/docs-sync.ts --ci

      - name: Auto-fix (on main push only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && success() == false
        run: |
          npx tsx scripts/docs-sync.ts --fix
          git config user.name 'IDEIA Bot'
          git config user.email 'bot@ideia.dev'
          git add docs/governance/REALITY-MANIFEST.md .ai/context/inject.json
          git commit -m "chore(docs): auto-sync documentation [skip ci]" || true
          git push
