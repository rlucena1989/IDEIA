name: Deploy - Development

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  ENVIRONMENT: development

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: IDEIA
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: IDEIA/package-lock.json
      - run: npm ci
      - run: npx eslint . --max-warnings=0 || echo "Lint warnings found"
      - run: npx tsc -b --force
      - run: npx jest --passWithNoTests --coverage
      - run: npx tsx scripts/check-package-consistency.ts

  deploy:
    name: Deploy to Development
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: IDEIA
    environment: development
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: IDEIA/package-lock.json
      - run: npm ci
      - run: npm run build --if-present
      - name: Deploy
        run: |
          echo "Deploying to development environment"
          mkdir -p .deploy/current
          echo "${{ github.sha }}" > .deploy/active-version.txt
      - name: Health Check
        run: |
          echo "Development deploy complete"
