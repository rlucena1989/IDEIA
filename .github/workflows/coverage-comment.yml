name: Coverage Comment

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run tests with coverage
        run: npx jest --coverage --passWithNoTests

      - name: Extract coverage summary
        id: coverage
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            LINES=$(jq '.total.lines.pct' coverage/coverage-summary.json)
            STATEMENTS=$(jq '.total.statements.pct' coverage/coverage-summary.json)
            BRANCHES=$(jq '.total.branches.pct' coverage/coverage-summary.json)
            FUNCTIONS=$(jq '.total.functions.pct' coverage/coverage-summary.json)
            echo "lines=$LINES" >> $GITHUB_OUTPUT
            echo "statements=$STATEMENTS" >> $GITHUB_OUTPUT
            echo "branches=$BRANCHES" >> $GITHUB_OUTPUT
            echo "functions=$FUNCTIONS" >> $GITHUB_OUTPUT
          else
            echo "lines=0" >> $GITHUB_OUTPUT
            echo "statements=0" >> $GITHUB_OUTPUT
            echo "branches=0" >> $GITHUB_OUTPUT
            echo "functions=0" >> $GITHUB_OUTPUT
          fi

      - name: Comment coverage on PR
        uses: actions/github-script@v7
        with:
          script: |
            const lines = ${{ steps.coverage.outputs.lines }};
            const statements = ${{ steps.coverage.outputs.statements }};
            const branches = ${{ steps.coverage.outputs.branches }};
            const functions = ${{ steps.coverage.outputs.functions }};

            const color = (v) => v >= 80 ? 'green' : v >= 50 ? 'orange' : 'red';
            const bar = (v) => '█'.repeat(Math.round(v / 10)) + '░'.repeat(10 - Math.round(v / 10));

            const body = [
              '## 📊 Coverage Report',
              '',
              `| Metric | Coverage | Bar |`,
              `|--------|----------|-----|`,
              `| **Lines** | ${lines.toFixed(1)}% | ${bar(lines)} |`,
              `| **Statements** | ${statements.toFixed(1)}% | ${bar(statements)} |`,
              `| **Branches** | ${branches.toFixed(1)}% | ${bar(branches)} |`,
              `| **Functions** | ${functions.toFixed(1)}% | ${bar(functions)} |`,
              '',
              `> 🎯 Target: **80%** | ${lines >= 80 ? '✅ Pass' : '❌ Below target'}`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes('## 📊 Coverage Report'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report-${{ github.run_number }}
          path: coverage/
          retention-days: 14
