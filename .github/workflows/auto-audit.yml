name: Auto-Audit Loop

on:
  schedule:
    - cron: '0 6 * * 1-5' # Every weekday at 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.ai/bin/*.js'
      - 'packages/**/*.ts'
      - 'docs/governance/*.md'

permissions:
  contents: read
  issues: write
  checks: write

jobs:
  auto-audit:
    name: Autonomous Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run full audit loop
        run: node .ai/bin/auto-audit-loop.js --ci
        continue-on-error: true
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: .ai/audit/auto/
      - name: Check issues file
        id: issues
        run: |
          if [ -f .ai/audit/issues.json ]; then
            COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.ai/audit/issues.json','utf-8')).length)")
            echo "count=$COUNT" >> $GITHUB_OUTPUT
          else
            echo "count=0" >> $GITHUB_OUTPUT
          fi
      - name: Create issue on failure
        if: steps.issues.outputs.count > 0
        uses: actions/github-script@v7
        with:
          script: |
            const issues = require('fs').readFileSync('.ai/audit/issues.json', 'utf-8');
            const parsed = JSON.parse(issues);
            const body = parsed.map(i => `- [${i.severity}] ${i.scanner}: ${i.description}`).join('\n');
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Auto-Audit] ${parsed.length} issues found on ${new Date().toISOString().slice(0, 10)}`,
              body: `## Auto-Audit Results\n\n${body}\n\n---\n_Generated by IDEIA Auto-Audit Loop_`,
              labels: ['audit', 'auto-generated'],
            });
