name: Security Audit
on:
  schedule: [{ cron: '0 8 * * 1' }]
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: Secret scan
        run: npx tsx scripts/security-pentest.ts --ci --json > .ai/security-report.json
      - name: Red teaming
        run: node scripts/red-teaming.js --ci --report .ai/red-team-report.md
      - name: Extended red teaming
        run: node scripts/red-teaming-extended.js --ci --report .ai/red-team-extended.md
      - name: SBOM
        run: npx tsx scripts/generate-sbom.ts --ci
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: .ai/security-*
