name: Supply Chain Security

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday 6 AM
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate SBOM
        run: node .ai/bin/generate-sbom.js
      - name: Upload SBOM
        uses: actions/upload-artifact@v5
        with:
          name: sbom
          path: sbom.json

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Generate audit report
        run: |
          npm audit --json > audit-report.json 2>/dev/null || true
          echo "Audit report generated"
      - name: Upload audit report
        uses: actions/upload-artifact@v5
        with:
          name: audit-report
          path: audit-report.json

  license:
    name: License Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check licenses
        run: |
          npx license-checker --summary --onlyAllow "MIT;Apache-2.0;ISC;BSD-2-Clause;BSD-3-Clause;CC0-1.0;Unlicense;Python-2.0;0BSD" --excludePackagesStartingWith "@ai-devkit" 2>/dev/null || true
